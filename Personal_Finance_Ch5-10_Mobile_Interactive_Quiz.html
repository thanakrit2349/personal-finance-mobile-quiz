<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Personal Finance Quiz</title><style>
:root{--navy:#12355b;--teal:#167176;--pale:#eef8f8;--line:#c8dfe1}*{box-sizing:border-box}body{margin:0;background:#f3f7fa;color:#172b4d;font-family:"Leelawadee UI",Tahoma,Arial,sans-serif;font-size:17px;line-height:1.55}.app{max-width:700px;margin:auto;min-height:100vh;background:#fff;padding:22px 18px 38px}h1{font-size:1.55rem;line-height:1.25;color:var(--navy);margin:0 0 6px}.sub{color:#526b80;margin:0 0 16px}.bar{height:9px;border-radius:8px;background:#e2eaee;overflow:hidden;margin:13px 0 20px}.bar>span{display:block;height:100%;background:var(--teal);transition:width .25s}.count{font-size:.9rem;color:#526b80}.question{font-weight:700;font-size:1.15rem;margin:15px 0}.choice{display:block;width:100%;text-align:left;background:white;border:2px solid var(--line);border-radius:12px;padding:14px;margin:10px 0;font:inherit;color:inherit;cursor:pointer}.choice.selected{border-color:var(--teal);background:var(--pale)}.choice.correct{border-color:#198754;background:#e6f6ed}.choice.wrong{border-color:#c0392b;background:#fdecea}.feedback{margin:16px 0;padding:13px;border-radius:10px;background:var(--pale);display:none}.actions{display:flex;gap:10px;margin-top:18px}.primary,.secondary{border:0;border-radius:10px;padding:13px 16px;font:inherit;font-weight:700;cursor:pointer}.primary{background:var(--navy);color:#fff;flex:1}.secondary{background:#e8edf1;color:var(--navy)}.primary:disabled{opacity:.5}.result{text-align:center;padding:28px 8px}.score{font-size:3rem;color:var(--teal);font-weight:800}.small{font-size:.88rem;color:#526b80}@media(max-width:420px){body{font-size:16px}.app{padding:18px 14px 30px}.choice{padding:12px}}</style></head><body><main class="app"><h1>Personal Finance Quiz</h1><p class="sub">Chapters 5-10 • ข้อสอบ 50 ข้อ พร้อมเฉลย</p><div id="quiz"></div></main><script>
const data = [{"ch": "5", "q": "Which statement best distinguishes credit from debt? / ข้อใดแยกความหมายของเครดิตและหนี้ได้ถูกต้องที่สุด?", "options": ["Credit is money owed; debt is permission to borrow.", "Credit is permission/agreement to borrow; debt is the amount owed after use.", "They always mean exactly the same thing.", "Debt never has interest."], "answer": 1, "explanation": "Credit is the borrowing mechanism; debt is the resulting obligation. / เครดิตคือกลไกหรือสิทธิในการกู้ ส่วนหนี้คือภาระที่เกิดขึ้นจริง."}, {"ch": "5", "q": "In the snowball method, which debt is the focus first? / วิธี Snowball ให้โฟกัสหนี้ใดก่อน?", "options": ["Highest interest rate", "Largest balance", "Smallest balance", "Oldest account"], "answer": 2, "explanation": "Snowball starts with the smallest balance to create quick wins and motivation. / เริ่มจากยอดคงเหลือน้อยสุดเพื่อเห็นผลเร็วและมีกำลังใจ."}, {"ch": "5", "q": "Why can the avalanche method reduce total interest? / เหตุใด Avalanche จึงอาจลดดอกเบี้ยรวมได้?", "options": ["It pays no minimum payments.", "It targets the highest-interest debt first.", "It ignores all small debts.", "It extends the repayment period."], "answer": 1, "explanation": "Paying the most expensive interest rate first usually lowers total interest paid. / การกำจัดหนี้ดอกเบี้ยสูงก่อนมักทำให้ดอกเบี้ยรวมลดลง."}, {"ch": "5", "q": "What must be done for every debt while paying off one focus debt? / ระหว่างโปะหนี้เป้าหมาย ต้องทำอะไรกับหนี้ทุกก้อน?", "options": ["Pay at least the minimum monthly payment.", "Stop paying them.", "Transfer all balances to cash.", "Close all accounts immediately."], "answer": 0, "explanation": "Both methods require minimum payments on all debts. / ทั้งสองวิธีต้องจ่ายขั้นต่ำของหนี้ทุกบัญชี."}, {"ch": "5", "q": "After a focus debt is fully paid, extra money should be used to: / เมื่อปิดหนี้เป้าหมายแล้ว ควรนำเงินเพิ่มไปทำอะไร?", "options": ["Skip all payments next month.", "Move to the next focus debt.", "Borrow again immediately.", "Pay only fees."], "answer": 1, "explanation": "Roll the former payment into the next target until all debts are gone. / นำเงินที่เคยจ่ายก้อนนั้นไปโปะหนี้เป้าหมายถัดไป."}, {"ch": "5", "q": "A high credit-card balance is best described as: / ยอดคงค้างบัตรเครดิตสูงจัดเป็นอะไร?", "options": ["Credit permission only", "Personal/consumer debt", "An investment return", "An insurance premium"], "answer": 1, "explanation": "Once borrowed funds are used and owed back, they are debt. / เมื่อใช้วงเงินแล้วเกิดยอดที่ต้องคืน นั่นคือหนี้."}, {"ch": "6", "q": "What does an insurance premium represent? / เบี้ยประกันคืออะไร?", "options": ["Money the insurer pays after every accident", "Payment made by the insured for coverage", "The value of a damaged car", "A tax refund"], "answer": 1, "explanation": "The insured pays a premium; the insurer provides specified protection. / ผู้เอาประกันจ่ายเบี้ยเพื่อแลกกับความคุ้มครองตามสัญญา."}, {"ch": "6", "q": "Risk pooling means: / Risk pooling หมายถึงอะไร?", "options": ["One client pays every loss alone.", "Insurers spread risk across many clients.", "All claims are denied.", "Premiums are investments in stocks only."], "answer": 1, "explanation": "Pooling makes loss payments more affordable across insured people. / การรวมความเสี่ยงช่วยเฉลี่ยภาระค่าเสียหายระหว่างผู้เอาประกัน."}, {"ch": "6", "q": "Which policy mainly replaces income when a person cannot work for months or years? / ประกันใดเน้นทดแทนรายได้เมื่อทำงานไม่ได้หลายเดือนหรือหลายปี?", "options": ["Renters insurance", "Long-term disability insurance", "Collision insurance", "Umbrella insurance"], "answer": 1, "explanation": "LTD is designed for prolonged inability to work; slides cite roughly 65% income replacement. / LTD ชดเชยรายได้เมื่อทุพพลภาพระยะยาว โดยสไลด์ยกประมาณ 65%."}, {"ch": "6", "q": "Thai compulsory motor insurance (Por Ror Bor.) does NOT cover: / พ.ร.บ. รถยนต์ไม่คุ้มครองอะไร?", "options": ["Injury to accident victims", "Bodily harm", "Damage to the insured’s own vehicle", "Medical expenses within coverage"], "answer": 2, "explanation": "The slides explicitly state it does not cover the insured vehicle’s own damage. / สไลด์ระบุชัดว่าไม่คุ้มครองความเสียหายของรถผู้เอาประกัน."}, {"ch": "6", "q": "Which voluntary motor class is most comprehensive? / ประกันรถยนต์ภาคสมัครใจชั้นใดคุ้มครองครอบคลุมที่สุด?", "options": ["Class 1", "Class 2", "Class 3", "Por Ror Bor. only"], "answer": 0, "explanation": "Class 1 covers own-car damage, third-party loss, and events such as fire, flood, theft, and single-car accidents. / ชั้น 1 ครอบคลุมกว้างที่สุด."}, {"ch": "6", "q": "Which coverage pays for your own car’s repair after you cause a collision? / ความคุ้มครองใดช่วยค่าซ่อมรถของตนเองเมื่อเกิดการชน?", "options": ["Liability only", "Collision coverage", "Life insurance", "Health insurance"], "answer": 1, "explanation": "Liability addresses harm to others; collision addresses repair of your own vehicle. / ความรับผิดชอบต่อบุคคลภายนอกต่างจากความคุ้มครองการชนของรถเรา."}, {"ch": "6", "q": "Why is renters insurance useful? / เหตุใดประกันผู้เช่าจึงมีประโยชน์?", "options": ["It buys the rented building for you.", "It helps protect personal belongings.", "It eliminates rent.", "It replaces a mortgage."], "answer": 1, "explanation": "It protects a renter’s personal property; replacement-cost coverage is emphasized. / ช่วยคุ้มครองทรัพย์สินส่วนตัวของผู้เช่า."}, {"ch": "6", "q": "When may umbrella insurance become relevant? / เมื่อใด Umbrella policy จึงมีความสำคัญ?", "options": ["When you have assets exposed to lawsuits", "Only before buying a bicycle", "When paying income tax", "To insure a phone screen"], "answer": 0, "explanation": "It adds liability protection for personal assets against lawsuits. / เป็นความคุ้มครองความรับผิดเพิ่มเติมเพื่อป้องกันทรัพย์สินจากการถูกฟ้อง."}, {"ch": "6", "q": "Which is a sound auto-insurance practice? / ข้อใดเป็นแนวปฏิบัติที่ดีในการซื้อประกันรถ?", "options": ["Buy legal minimum without comparison.", "Get quotes from several insurers.", "Never update a policy after moving.", "Buy every add-on automatically."], "answer": 1, "explanation": "Compare quotes and review coverage as life circumstances change. / ควรเปรียบเทียบหลายบริษัทและทบทวนความคุ้มครองเมื่อสถานการณ์เปลี่ยน."}, {"ch": "7", "q": "How is net income calculated in the slides? / เงินได้สุทธิคำนวณอย่างไร?", "options": ["Income + expenses + allowances", "Total income - expenses - deductions/allowances", "Salary - tax only", "Assets - liabilities"], "answer": 1, "explanation": "Tax is based on income after allowable expenses and deductions. / ฐานภาษีคือรายได้หลังหักค่าใช้จ่ายและค่าลดหย่อน."}, {"ch": "7", "q": "The slides state that filing is required from annual income of: / สไลด์ระบุว่ารายได้ต่อปีตั้งแต่เท่าใดต้องยื่นภาษี?", "options": ["60,000 baht", "100,000 baht", "120,000 baht", "150,000 baht"], "answer": 2, "explanation": "The lesson uses 120,000 baht per year (about 10,000 per month). / เอกสารใช้เกณฑ์ 120,000 บาทต่อปี."}, {"ch": "7", "q": "What is the personal allowance used in the examples? / ค่าลดหย่อนส่วนตัวในตัวอย่างคือเท่าใด?", "options": ["30,000 baht", "50,000 baht", "60,000 baht", "100,000 baht"], "answer": 2, "explanation": "The personal allowance shown is 60,000 baht. / ค่าลดหย่อนส่วนตัวที่สไลด์ใช้คือ 60,000 บาท."}, {"ch": "7", "q": "Under the progressive rates shown, the first 150,000 baht of net income is: / เงินได้สุทธิ 150,000 บาทแรกตามสไลด์เป็นอย่างไร?", "options": ["Taxed at 5%", "Exempt", "Taxed at 10%", "Taxed at 35%"], "answer": 1, "explanation": "The first bracket is exempt, then 5% applies to the next portion. / ขั้นแรกยกเว้นภาษี จากนั้นจึงเริ่มขั้น 5%."}, {"ch": "7", "q": "A salary worker earns 650,000 baht. Using the example deductions (100,000 expense and 60,000 personal allowance), net income is: / รายได้ 650,000 บาท หักค่าใช้จ่าย 100,000 และค่าลดหย่อน 60,000 เงินได้สุทธิคือ?", "options": ["390,000", "450,000", "490,000", "550,000"], "answer": 2, "explanation": "650,000 - 100,000 - 60,000 = 490,000 baht. / คำนวณได้ 490,000 บาท."}, {"ch": "7", "q": "In that salary example, tax payable is: / ตัวอย่างพนักงานเงินเดือนดังกล่าว ต้องเสียภาษีเท่าใด?", "options": ["7,500", "19,000", "26,500", "49,000"], "answer": 2, "explanation": "7,500 from the 5% band plus 19,000 from the 10% band = 26,500. / รวม 7,500 + 19,000 = 26,500 บาท."}, {"ch": "7", "q": "Which donation type can be deducted at twice the paid amount, subject to a cap? / เงินบริจาคประเภทใดหักได้ 2 เท่าแต่มีเพดาน?", "options": ["Education/public-benefit donation", "Any personal shopping", "Credit-card repayment", "Car repair"], "answer": 0, "explanation": "The slides list education, sports, social development, public benefit, and government hospitals as 2x, capped. / กลุ่มบริจาคเพื่อการศึกษาและสาธารณประโยชน์หักได้ 2 เท่าภายใต้เพดาน."}, {"ch": "7", "q": "A tax refund occurs when: / จะได้รับเงินคืนภาษีเมื่อใด?", "options": ["Final tax owed is higher than tax paid.", "Tax paid/withheld exceeds final tax liability.", "You have no income.", "You buy an investment."], "answer": 1, "explanation": "A refund returns excess tax already paid relative to the final calculation. / เงินคืนเกิดเมื่อจ่ายหรือถูกหักภาษีไว้เกินกว่าภาษีที่คำนวณได้จริง."}, {"ch": "7", "q": "Which is a sensible use of a tax refund mentioned in the slides? / ข้อใดเป็นการใช้เงินคืนภาษีที่สไลด์แนะนำ?", "options": ["Increase high-interest card debt", "Build an emergency fund", "Ignore unpaid bills", "Pay a late fee intentionally"], "answer": 1, "explanation": "The slides suggest emergency savings, retirement, debt repayment, future goals, investing, or skills. / สไลด์เสนอให้เพิ่มกองทุนฉุกเฉิน เป็นต้น."}, {"ch": "7", "q": "A progressive tax system means: / ระบบภาษีก้าวหน้าหมายถึงอะไร?", "options": ["One rate applies to all net income.", "Different portions of income are taxed at different rates.", "Tax is optional.", "Only expenses are taxed."], "answer": 1, "explanation": "Each band is calculated at its own rate; do not apply the top bracket to all income. / รายได้แต่ละช่วงเสียภาษีตามอัตราของช่วงนั้น."}, {"ch": "8", "q": "Before investing, the slides recommend an emergency fund of: / ก่อนลงทุน สไลด์แนะนำกองทุนฉุกเฉินกี่เดือน?", "options": ["1 month", "3-6 months", "12-24 months mandatory", "None"], "answer": 1, "explanation": "Emergency savings of 3-6 months should come before a separate investment fund. / ควรมีเงินฉุกเฉิน 3-6 เดือนก่อน."}, {"ch": "8", "q": "Which action best demonstrates diversification? / ข้อใดแสดงถึงการกระจายความเสี่ยง?", "options": ["Put all money in one stock.", "Spread funds across several investment types.", "Borrow to buy one asset.", "Invest without research."], "answer": 1, "explanation": "Diversification means not concentrating all funds in one investment. / คือการไม่ทุ่มเงินทั้งหมดไว้ในสินทรัพย์เดียว."}, {"ch": "8", "q": "Which statement describes a bond holder? / ผู้ถือตราสารหนี้มีสถานะใด?", "options": ["Company owner", "Creditor to the issuer", "Insurance underwriter", "Tenant"], "answer": 1, "explanation": "The investor lends to the issuer, receives interest, and gets principal at maturity. / นักลงทุนเป็นเจ้าหนี้ ได้ดอกเบี้ยและเงินต้นคืนเมื่อครบกำหนด."}, {"ch": "8", "q": "A market order is executed: / Market order จะถูกดำเนินการอย่างไร?", "options": ["Only at a price chosen by the buyer.", "At the current market price when it reaches the market.", "Only after one year.", "Never until a dividend is paid."], "answer": 1, "explanation": "A market order prioritizes immediate execution, not a guaranteed chosen price. / เน้นการทำรายการทันทีตามราคาตลาดขณะนั้น."}, {"ch": "8", "q": "A limit buy order at $9 will execute when: / Limit buy ที่ $9 จะเกิดขึ้นเมื่อใด?", "options": ["Price is $9 or lower", "Price is $10 or higher", "Any price, immediately", "The company pays a dividend"], "answer": 0, "explanation": "A limit buy sets the maximum purchase price. / Limit buy กำหนดราคาซื้อสูงสุด."}, {"ch": "8", "q": "For a stock bought for $2,000, now worth $2,400, with $100 dividends, ROI is: / ซื้อหุ้น 2,000 มูลค่าปัจจุบัน 2,400 ได้ปันผล 100 ROI เท่าใด?", "options": ["3%", "10%", "20%", "25%"], "answer": 3, "explanation": "(2,400 - 2,000 + 100) / 2,000 = 25%. / คำนวณได้ 25%."}, {"ch": "8", "q": "Bond prices generally move how when interest rates rise? / โดยทั่วไปเมื่อดอกเบี้ยขึ้น ราคาตราสารหนี้เป็นอย่างไร?", "options": ["Move inversely/down", "Always double", "Never change", "Become legal tender"], "answer": 0, "explanation": "Interest-rate risk is the inverse relationship between rates and bond prices. / ความเสี่ยงดอกเบี้ยคือราคาตราสารหนี้เคลื่อนไหวสวนทางกับอัตราดอกเบี้ย."}, {"ch": "8", "q": "Which is a common index-fund benefit in the slides? / ข้อใดเป็นข้อดีของกองทุนดัชนีตามสไลด์?", "options": ["Guaranteed profit", "Lower costs and broad holdings", "No market risk whatsoever", "A single-company focus"], "answer": 1, "explanation": "Index funds are passive, often lower cost, broadly diversified, and trade less. / จุดเด่นคือบริหารแบบพาสซีฟ ต้นทุนต่ำ และถือครองหลากหลาย."}, {"ch": "8", "q": "A bull market is generally associated with: / ตลาดกระทิงมักสัมพันธ์กับอะไร?", "options": ["High confidence and rising stock prices", "Falling prices and anxiety only", "No investment activity", "Guaranteed bubbles"], "answer": 0, "explanation": "The slides describe high investor confidence and rising prices in a bull market. / ตลาดกระทิงมีความเชื่อมั่นสูงและราคาหุ้นขึ้น."}, {"ch": "8", "q": "GDP is used to: / GDP ใช้เพื่ออะไร?", "options": ["Measure overall economic size/growth", "Set one stock’s dividend", "Insure a house", "Calculate a lease deposit"], "answer": 0, "explanation": "GDP indicates whether the overall economy is growing or contracting. / ใช้วัดขนาดเศรษฐกิจและการเติบโต/หดตัว."}, {"ch": "9", "q": "A key advantage of renting is: / ข้อดีสำคัญของการเช่าคือ?", "options": ["It always creates equity.", "Lower initial cost and greater flexibility.", "No monthly payment.", "The tenant owns the building."], "answer": 1, "explanation": "Renters generally need a deposit and first month’s rent, not a down payment and closing costs. / เงินเริ่มต้นมักต่ำกว่าและย้ายได้ยืดหยุ่นกว่า."}, {"ch": "9", "q": "A key financial benefit of buying a home is: / ประโยชน์ทางการเงินสำคัญของการซื้อบ้านคือ?", "options": ["No maintenance responsibility", "Building equity through mortgage payments", "No upfront cash needed", "No property taxes"], "answer": 1, "explanation": "Part of mortgage payments builds ownership equity. / การผ่อนชำระช่วยสะสมส่วนของเจ้าของ."}, {"ch": "9", "q": "Before signing a lease, verbal promises should be: / ก่อนเซ็นสัญญาเช่า คำสัญญาปากเปล่าควรทำอย่างไร?", "options": ["Ignored because they are binding automatically", "Put in writing and signed", "Replaced with a phone call", "Kept secret"], "answer": 1, "explanation": "The lesson stresses written, signed changes; oral assurances are not enough. / ต้องเขียนเป็นลายลักษณ์อักษรและลงนาม."}, {"ch": "9", "q": "Mortgage preapproval examines: / การขอพรีอนุมัติสินเชื่อบ้านตรวจอะไร?", "options": ["Only favorite paint colors", "Income, debts, credit, and assets", "Only the house address", "Only age"], "answer": 1, "explanation": "The lender assesses financial capacity and gives a workable loan limit. / ธนาคารประเมินความสามารถทางการเงินเพื่อกำหนดวงเงิน."}, {"ch": "9", "q": "Which repair funding source is preferred in the slides? / สไลด์แนะนำแหล่งเงินใดเป็นอันดับแรกสำหรับซ่อมบ้าน?", "options": ["Contractor financing", "Savings/emergency or project fund", "Unlimited credit cards", "Payday loan"], "answer": 1, "explanation": "Savings avoids interest and finance charges. / เงินออมไม่ก่อดอกเบี้ยและค่าธรรมเนียมทางการเงิน."}, {"ch": "9", "q": "Which statement distinguishes a home equity loan from a HELOC? / ข้อใดแยก Home Equity Loan กับ HELOC ได้ถูกต้อง?", "options": ["Loan is fixed; HELOC is flexible/variable.", "Both are always identical.", "HELOC cannot use home equity.", "Loan has no repayment."], "answer": 0, "explanation": "The slides describe fixed loan terms versus a line of credit that changes with use/conditions. / สินเชื่อบ้านมีเงื่อนไขคงที่ ส่วน HELOC เป็นวงเงินยืดหยุ่นและอาจผันแปร."}, {"ch": "9", "q": "Standard home insurance generally does not cover: / ประกันบ้านมาตรฐานโดยทั่วไปไม่คุ้มครองอะไร?", "options": ["Sudden pipe break handled promptly", "External flooding without separate flood policy", "Covered fire", "Covered theft"], "answer": 1, "explanation": "External flood damage normally needs separate flood insurance. / น้ำท่วมจากภายนอกมักต้องซื้อประกันน้ำท่วมแยกต่างหาก."}, {"ch": "9", "q": "Why is overpricing a home risky? / เหตุใดการตั้งราคาบ้านสูงเกินไปจึงเสี่ยง?", "options": ["It always attracts more qualified buyers.", "It can sit longer and weaken negotiation after cuts.", "It removes closing costs.", "It guarantees the list price."], "answer": 1, "explanation": "The slides warn that a stale listing and later cuts signal weakness. / บ้านค้างตลาดนานและลดราคาทีหลังอาจทำให้ต่อรองเสียเปรียบ."}, {"ch": "10", "q": "Who manages trust assets for beneficiaries? / ใครมีหน้าที่บริหารทรัพย์สินในทรัสต์ให้ผู้รับผลประโยชน์?", "options": ["Settlor/Grantor", "Trustee", "Beneficiary only", "Witness"], "answer": 1, "explanation": "The Trustee manages assets according to the trust agreement. / Trustee บริหารทรัพย์สินตามเงื่อนไขทรัสต์."}, {"ch": "10", "q": "A testamentary trust takes effect: / Testamentary Trust มีผลเมื่อใด?", "options": ["During grantor’s lifetime only", "Upon the grantor’s death through a will", "When a stock rises", "After a car accident"], "answer": 1, "explanation": "It is created through a will and operates after death. / กำหนดในพินัยกรรมและมีผลหลังเจ้าของเสียชีวิต."}, {"ch": "10", "q": "Which trust is designed for a person unable to manage finances independently? / ทรัสต์ใดออกแบบมาเพื่อผู้ที่จัดการการเงินเองไม่ได้?", "options": ["Charitable trust", "Special needs trust", "Index trust", "Mortgage trust"], "answer": 1, "explanation": "A special needs trust provides managed support for such a beneficiary. / ใช้ดูแลผู้มีความต้องการพิเศษหรือจัดการทรัพย์สินเองไม่ได้."}, {"ch": "10", "q": "A legal observation about will witnesses is: / ข้อสังเกตทางกฎหมายเกี่ยวกับพยานพินัยกรรมคือ?", "options": ["They should receive the largest benefit.", "They cannot have a conflict or benefit under the will.", "They must be beneficiaries.", "They need no independence."], "answer": 1, "explanation": "The slides state witnesses must not have an interest and cannot inherit under the will. / พยานต้องไม่มีส่วนได้เสียและไม่รับมรดกตามพินัยกรรม."}, {"ch": "10", "q": "How often do the slides suggest reviewing a will? / สไลด์แนะนำให้ทบทวนพินัยกรรมทุกกี่ปี?", "options": ["Every month", "Every 1-2 years only", "Every 5-10 years", "Never"], "answer": 2, "explanation": "Regular review every 5-10 years keeps the plan current. / ทบทวนทุก 5-10 ปีเพื่อให้สอดคล้องสถานการณ์."}, {"ch": "10", "q": "Cryptocurrency is described as: / คริปโทเคอร์เรนซีตามสไลด์คืออะไร?", "options": ["Legal tender guaranteed by every central bank", "Electronic data used as a medium of exchange if accepted", "A home insurance policy", "A type of tax allowance"], "answer": 1, "explanation": "It is not central-bank-guaranteed legal tender, though parties may accept it. / ไม่ใช่เงินที่ธนาคารกลางรับรอง แต่ใช้แลกเปลี่ยนได้หากคู่สัญญายอมรับ."}, {"ch": "10", "q": "An ICO token holder is NOT necessarily: / ผู้ถือโทเคนจาก ICO ไม่จำเป็นต้องเป็นอะไร?", "options": ["A shareholder or creditor of the company", "A holder of rights described in a white paper", "A participant in a token project", "A user of a utility token"], "answer": 0, "explanation": "ICO tokens may confer neither ownership nor creditor/liquidation rights; rights follow the white paper. / อาจไม่ใช่เจ้าของหรือเจ้าหนี้ สิทธิยึดตาม White Paper."}];let index=0, answers=Array(data.length).fill(null), checked=false;const root=document.getElementById('quiz');
function render(){if(index===data.length){const score=answers.reduce((n,a,i)=>n+(a===data[i].answer),0);root.innerHTML=`<section class="result"><div class="count">ทำครบแล้ว / Completed</div><div class="score">${score}/50</div><p>คะแนนของคุณ / Your score: ${Math.round(score*2)}%</p><p class="small">ทบทวนเฉลยได้โดยเริ่มใหม่ / Restart to review every explanation.</p><button class="primary" onclick="restart()">เริ่มใหม่ / Restart</button></section>`;return}const x=data[index], letters=['A','B','C','D'];root.innerHTML=`<div class="count">ข้อ ${index+1} จาก 50 • Question ${index+1} of 50</div><div class="bar"><span style="width:${index/50*100}%"></span></div><div class="question">[Ch. ${x.ch}] ${x.q}</div><div>${x.options.map((o,i)=>`<button class="choice ${answers[index]===i?'selected':''}" onclick="choose(${i})">${letters[i]}. ${o}</button>`).join('')}</div><div id="feedback" class="feedback"></div><div class="actions"><button class="secondary" onclick="previous()" ${index===0?'disabled':''}>← ก่อนหน้า</button><button id="check" class="primary" onclick="submitAnswer()" ${answers[index]===null?'disabled':''}>ตรวจคำตอบ / Check</button><button id="next" class="primary" style="display:none" onclick="next()">ถัดไป →</button></div>`;if(checked)showFeedback()}
function choose(i){if(checked)return;answers[index]=i;render()}function submitAnswer(){if(answers[index]===null)return;checked=true;showFeedback()}function showFeedback(){const x=data[index], chosen=answers[index], nodes=document.querySelectorAll('.choice');nodes.forEach((n,i)=>{if(i===x.answer)n.classList.add('correct');if(i===chosen&&i!==x.answer)n.classList.add('wrong')});const f=document.getElementById('feedback');f.style.display='block';f.innerHTML=`<b>${chosen===x.answer?'ถูกต้อง / Correct':'ยังไม่ถูก / Not quite'}</b><br><b>เฉลย / Answer: ${'ABCD'[x.answer]}</b><br>${x.explanation}`;document.getElementById('check').style.display='none';document.getElementById('next').style.display='block'}function next(){index++;checked=false;render();window.scrollTo(0,0)}function previous(){if(index>0){index--;checked=false;render();window.scrollTo(0,0)}}function restart(){index=0;answers=Array(data.length).fill(null);checked=false;render()}render();
</script></main></body></html>
